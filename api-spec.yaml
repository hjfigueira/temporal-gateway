openapi: 3.0.3
info:
  title: Order Service Gateway
  version: "1.0.0"
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Start a new order workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ orderId, customerId ]
              properties:
                orderId:
                  type: string
                customerId:
                  type: string
                items:
                  type: array
                  items:
                    type: string
      x-temporal:
        # acceptPartial (the default, shown explicitly here) means the order
        # workflow starting is not contingent on the notification workflow
        # also starting: if one trigger fails, the response is 207
        # Multi-Status naming exactly which one - it's not rolled back to
        # allOrNothing's single 409, since a stuck notification shouldn't
        # block the order itself from being created.
        returnStrategy: acceptPartial
        triggers:
          - action: startWorkflow
            namespace: "${TEMPORAL_NAMESPACE:-default}"
            workflowType: OrderWorkflow
            workflowId: "order-{body.orderId}"
            taskQueue: "${ORDERS_TASK_QUEUE:-orders-task-queue}"
            idReusePolicy: AllowDuplicate
            workflowIdConflictPolicy: TerminateExisting
            workflowExecutionTimeout: 24h
            workflowRunTimeout: 1h
            workflowTaskTimeout: 10s
            retryPolicy:
              initialInterval: 1s
              backoffCoefficient: 2.0
              maximumInterval: 1m
              maximumAttempts: 3
              nonRetryableErrorTypes:
                - InvalidOrderError
            memo:
              source: gateway
            staticSummary: "Order workflow started via gateway"
          - action: startWorkflow
            namespace: "${TEMPORAL_NOTIFICATIONS_NAMESPACE:-default}"
            workflowType: NotificationWorkflow
            workflowId: "order-{body.orderId}-notification"
            taskQueue: "${NOTIFICATIONS_TASK_QUEUE:-notifications-task-queue}"
            idReusePolicy: RejectDuplicate
            startDelay: 5s
      responses:
        "202":
          description: Order and notification workflows started.

  /orders/{orderId}/cascade:
    post:
      operationId: createOrderViaCascade
      summary: >-
        Same as POST /orders, but dispatched via the "nexus" driver instead
        of "direct": the gateway starts a single CascadeEvent workflow (in
        the "cascade" namespace/taskQueue below) rather than starting
        OrderWorkflow/NotificationWorkflow itself; CascadeEvent fans them
        out over Nexus. See the "nexus driver" section of README.md - the
        default/notifications namespaces' nexusEndpoint (config.yml) must
        name a Nexus endpoint actually provisioned on the server for this
        to reach them; the HTTP response only reports the CascadeEvent
        workflow's own start outcome, not each trigger's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ orderId, customerId ]
              properties:
                orderId:
                  type: string
                customerId:
                  type: string
      x-temporal:
        driver: nexus
        config:
          namespace: "${TEMPORAL_CASCADE_NAMESPACE:-cascade}"
          taskQueue: "${CASCADE_TASK_QUEUE:-cascade-task-queue}"
          workflowId: "cascade-order-{body.orderId}"
        triggers:
          - action: startWorkflow
            namespace: "${TEMPORAL_NAMESPACE:-default}"
            workflowType: OrderWorkflow
            workflowId: "order-{body.orderId}-cascade"No
            taskQueue: "${ORDERS_TASK_QUEUE:-orders-task-queue}"
          - action: startWorkflow
            namespace: "${TEMPORAL_NOTIFICATIONS_NAMESPACE:-notifications}"
            workflowType: NotificationWorkflow
            workflowId: "order-{body.orderId}-cascade-notification"
            taskQueue: "${NOTIFICATIONS_TASK_QUEUE:-notifications-task-queue}"
      responses:
        "202":
          description: CascadeEvent workflow started; the order/notification workflows it fans out to dispatch asynchronously via Nexus.

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Fetch the current state of an order via a workflow query.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      x-temporal:
        triggers:
          - action: queryWorkflow
            namespace: "${TEMPORAL_NAMESPACE:-default}"
            workflowId: "order-{path.orderId}"
            queryType: getOrderState
      responses:
        "200":
          description: Current order state.

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Signal a running order workflow to cancel.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      x-temporal:
        triggers:
          - action: signalWorkflow
            namespace: "${TEMPORAL_NAMESPACE:-default}"
            workflowId: "order-{path.orderId}"
            signalName: cancelOrder
      responses:
        "202":
          description: Cancellation signal accepted.

  /orders/{orderId}/result:
    get:
      operationId: getOrderResult
      summary: Block until the order workflow completes and return its result.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      x-temporal:
        triggers:
          - action: getResult
            namespace: "${TEMPORAL_NAMESPACE:-default}"
            workflowId: "order-{path.orderId}"
      responses:
        "200":
          description: Workflow result.
